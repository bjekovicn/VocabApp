@if (!authReady()) {
  <main class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
    <div class="w-full max-w-md rounded-2xl bg-white p-8 text-center shadow-lg">
      <div class="mb-6">
        <app-language-switcher />
      </div>
      <h1 class="text-2xl font-bold text-slate-900">{{ i18n.t('app.name') }}</h1>
      <p class="mt-3 text-sm text-slate-600">{{ i18n.t('auth.loading') }}</p>
    </div>
  </main>
} @else if (currentUser()) {
  <app-navigation />
  <router-outlet />
} @else {
  <main class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
    <section class="w-full max-w-xl rounded-2xl bg-white p-8 shadow-lg">
      <div class="mb-6">
        <app-language-switcher />
      </div>
      <p class="text-sm font-semibold uppercase tracking-wide text-primary-600">
        {{ i18n.t('auth.googleSignIn') }}
      </p>
      <h1 class="mt-3 text-3xl font-bold text-slate-900">{{ i18n.t('auth.heroTitle') }}</h1>
      <p class="mt-4 text-base leading-7 text-slate-600">
        {{ i18n.t('auth.heroText') }}
      </p>
      <p class="mt-3 text-sm leading-6 text-slate-500">
        {{ i18n.t('auth.heroNote') }}
      </p>

      <button
        type="button"
        (click)="signInWithGoogle()"
        [disabled]="isAuthBusy()"
        class="mt-6 inline-flex w-full items-center justify-center rounded-xl bg-primary-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-primary-700 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ i18n.t('auth.continueWithGoogle') }}
      </button>

      @if (authError()) {
        <div class="mt-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
          {{ authError() }}
        </div>
      }
    </section>
  </main>
}
