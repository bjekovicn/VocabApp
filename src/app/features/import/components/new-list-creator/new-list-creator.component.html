<div class="mt-8">
  <div class="mb-6">
    <app-custom-input
      [label]="i18n.t('import.newListName')"
      [placeholder]="i18n.t('import.newListPlaceholder')"
      [value]="name()"
      (valueChange)="nameChange.emit($event)"
      [required]="true"
    />
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div>
      <app-custom-select
        [label]="i18n.t('import.learnLanguage')"
        [placeholder]="i18n.t('listForm.selectLanguage')"
        [options]="languageOptions()"
        [required]="true"
        [value]="sourceLanguage()"
        (valueChange)="sourceLanguageChange.emit($event!)"
      />
    </div>

    <div>
      <app-custom-select
        [label]="i18n.t('import.yourLanguage')"
        [placeholder]="i18n.t('listForm.selectLanguage')"
        [options]="languageOptions()"
        [required]="true"
        [value]="targetLanguage()"
        (valueChange)="targetLanguageChange.emit($event!)"
      />
    </div>
  </div>
</div>
