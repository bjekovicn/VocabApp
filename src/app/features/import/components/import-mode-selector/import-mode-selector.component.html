<div>
  <label class="block text-sm font-medium text-gray-700 mb-2">{{ i18n.t('import.mode') }}</label>
  <div class="flex gap-4">
    <app-custom-button
      variant="primary"
      [fullWidth]="true"
      [class.opacity-50]="mode() !== 'paste'"
      [class.bg-blue-200]="mode() !== 'paste'"
      (clicked)="modeChange.emit('paste')"
      [leftIcon]="'📋'"
    >
      {{ i18n.t('import.mode.paste') }}
    </app-custom-button>

    <app-custom-button
      variant="primary"
      [fullWidth]="true"
      [class.opacity-50]="mode() !== 'file'"
      [class.bg-blue-200]="mode() !== 'file'"
      (clicked)="modeChange.emit('file')"
      [leftIcon]="'📁'"
    >
      {{ i18n.t('import.mode.file') }}
    </app-custom-button>
  </div>
</div>
