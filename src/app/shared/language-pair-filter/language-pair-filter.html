<div class="flex gap-2">
  <div class="flex-1">
    <app-custom-select
      [placeholder]="i18n.t('listForm.sourceLanguage')"
      [options]="sourceOptions()"
      [value]="selectedSource()"
      (valueChange)="handleSourceChange($event)"
      variant="tertiary"
      size="small"
    />
  </div>
  <div class="flex-1">
    <app-custom-select
      [placeholder]="i18n.t('listForm.targetLanguage')"
      [options]="targetOptions()"
      [value]="selectedTarget()"
      (valueChange)="handleTargetChange($event)"
      variant="tertiary"
      size="small"
    />
  </div>
</div>
