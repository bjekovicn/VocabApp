<div class="w-full">
  @if (label()) {
    <label [class]="labelClasses()">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500">*</span>
      }
    </label>
  }
  <div class="relative">
    <select
      [ngModel]="value() ?? ''"
      (ngModelChange)="onModelChange($event)"
      [disabled]="disabled()"
      [required]="required()"
      [class]="selectClasses()"
      [class.opacity-60]="disabled()"
      [class.cursor-not-allowed]="disabled()"
    >
      @if (showPlaceholderOption()) {
        <option value="" [class]="variant() === 'tertiary' ? 'text-slate-900 bg-white' : ''">
          {{ placeholder() }}
        </option>
      }
      @for (option of options(); track option.value) {
        <option [value]="option.value" [class]="variant() === 'tertiary' ? 'text-slate-900 bg-white' : ''">
          {{ option.label }}
        </option>
      }
    </select>
    <!-- Chevron icon -->
    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2">
      <svg class="h-4 w-4" [class]="variant() === 'tertiary' ? 'text-white/70' : 'text-gray-500'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </div>
</div>
